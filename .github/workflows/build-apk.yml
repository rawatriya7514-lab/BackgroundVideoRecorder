name: Build and Release APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK for Release
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/BackgroundVideoRecorder-v1.0.2.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/BackgroundVideoRecorder-latest.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BackgroundVideoRecorder-APK
          path: release-assets/*.apk

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "v1.0.2 - Custom App Icon & Enhanced Premium UI/UX"
          body: |
            ### 🚀 Background Video Recorder v1.0.2

            #### 🎨 Custom App Icon & Premium UI Enhancements:
            - **Custom High-Resolution Launcher Icon**: Integrated user-provided branding icon across all mipmap densities (`mdpi`, `hdpi`, `xhdpi`, `xxhdpi`, `xxxhdpi`, and adaptive Android 8+ vector foreground/background).
            - **In-App Branding**: Integrated rounded brand logo in the header and consent modal.
            - **Pixel-Perfect Safe Insets**: Zero status bar, notch, and punch-hole overlap.
            - **Ultra-Responsive Controls**: 4K UHD, 1080p FHD, 720p HD resolution switcher & Front/Back camera lens controls.
            - **Tactile Hero Record Action**: Breathing halo pulse ring with instant feedback.
            - **Screen-Off Safe Pipeline**: CameraX `LifecycleService` + `PowerManager.PARTIAL_WAKE_LOCK`.
            - **1-Tap Desktop Shortcut**: Tap icon to record instantly.
          files: release-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
